<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Position Boxes</title>
    <style>
        /* Container fixed in the center */
        #boxContainer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: grid;
            grid-template-columns: repeat(9, 100px); /* 5 boxes per row */
            gap: 10px;
            background-color: rgba(0, 0, 0, 0.1);
            padding: 20px;
            border-radius: 10px;
        }

        /* Box styles */
        .box {
            width: 50px;
            height: 50px;
            background-color: lightblue;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            border: 0px solid #333;
        }

        /* Input and button */
        .controls {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Input and button section -->
    <div class="controls">
        <label for="numBoxes">Enter number of boxes: </label>
        <input type="number" id="numBoxes" min="1">
        <button onclick="generateBoxes()">Generate</button>
    </div>

    <!-- Box container -->
    <div id="boxContainer"></div>

    <script>
        function generateBoxes() {
            let n = document.getElementById("numBoxes").value;
            let container = document.getElementById("boxContainer");
            container.innerHTML = ""; // Clear previous boxes

            for (let i = 1; i <= n; i++) {
                let box = document.createElement("div");
                box.className = "box";
                box.textContent = i;
                container.appendChild(box);
            }
        }
    </script>

</body>
</html>
